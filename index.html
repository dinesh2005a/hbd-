<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Birthday Animation</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.1.3/TweenMax.min.js"></script>
</head>
<body>
  <audio class="song" src="music/happy-birthday.mp3" preload="auto"></audio>

  <div class="container" style="visibility: hidden;">
    <div class="one">Welcome</div>
    <div class="two">Get ready...</div>
    <div class="three">Here it comes!</div>
    <div class="four">🎉</div>
    <div class="fake-btn">Click Me</div>

    <div class="hbd-chatbox">Happy Birthday to you!</div>

    <div class="idea-1">You're amazing!</div>
    <div class="idea-2">Today is special</div>
    <div class="idea-3"><strong>Let's Celebrate!</strong></div>
    <div class="idea-4">More surprises ahead...</div>
    <div class="idea-5"><span>Wow!</span></div>
    <div class="idea-6"><span>Cheers!</span><span>🎈</span></div>

    <div class="baloons">
      <img src="img/balloon1.png" />
      <img src="img/balloon2.png" />
      <img src="img/balloon3.png" />
    </div>

    <div class="six">
      <video class="profile-video" autoplay muted loop playsinline>
        <source src="your-video-file.mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>
      <img src="img/hat.svg" class="hat" />
    </div>

    <div class="wish">
      <h1 class="wish-hbd">Happy Birthday!</h1>
      <h5>Have a great day 🎂</h5>
    </div>

    <div class="eight">
      <svg>...</svg>
    </div>

    <div class="nine">
      <p>Stay happy always!</p>
    </div>

    <button id="replay">Replay</button>
    <div class="last-smile">😊</div>
  </div>

  <script src="main.js"></script>
</body>
</html>
